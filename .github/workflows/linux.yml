name: Linux CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Linux artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run acceptance checks
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -p 4 ./...
          go vet -trimpath -p 4 ./...
          # Linux 最小可发行版本明确不实现的能力：AAC/M4A 解码
          # （internal/service/audio）、视频流（internal/service/video）、
          # 随包字体（internal/ui/widgets/typo）。这些包的测试在 Linux 上
          # 确定性失败——排除是「当前不支持」，不是「测试坏了」，能力落地时
          # 从这里删掉对应行，不是把测试改绿。
          LINUX_UNSUPPORTED_TEST_PACKAGES=(
            github.com/ShellMonster/PudMusic/internal/service/audio
            github.com/ShellMonster/PudMusic/internal/service/video
            github.com/ShellMonster/PudMusic/internal/ui/widgets/typo
          )
          printf -v unsupported '%s\n' "${LINUX_UNSUPPORTED_TEST_PACKAGES[@]}"
          go test -p 4 $(
            go list ./... \
              | grep -v '/internal/ui$' \
              | grep -vxFf <(printf '%s' "$unsupported")
          )
          go test ./internal/licensing/
          go generate ./internal/platform/ ./internal/licensing/
          git diff --exit-code -- resources

      - name: Build unsigned Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          unset MYGO_UPDATER_PRIVATE_KEY
          go tool mygo build -platform linux/amd64,linux/arm64

      - name: Validate Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          for target in linux-amd64 linux-arm64; do
            dir="build/$target"
            test -d "$dir" || { echo "missing $dir"; exit 1; }
            # 原生 UI：不拉 WebKitGTK。这是 mygo.json 的 linux.webview=false
            # 该换来的产物事实——少了它就是配置没生效。
            test -f "$dir/pudmusic" || { echo "$target: missing executable"; exit 1; }
            test -f "$dir/pudmusic.desktop" || { echo "$target: missing desktop entry"; exit 1; }
            test -f "$dir/install.sh" || { echo "$target: missing install.sh"; exit 1; }
            tar -tzf "$dir"/*-linux-*.tar.gz >/dev/null
            # Linux 上没有 AAC 解码器：desktop entry 不得登记 m4a / aac。
            # 这是「Linux 不登记放不了的格式」那份承诺在产物上的样子——
            # mygo.json 的 fileAssociations 已裁掉，这里断的是「真打出来
            # 的包里没有」，免得哪天配置又被加回去。
            if grep -qiE 'm4a|aac' "$dir/pudmusic.desktop"; then
              echo "$target desktop entry still registers AAC/M4A:"; cat "$dir/pudmusic.desktop"; exit 1
            fi
            deps="$(ar p "$dir"/*.deb control.tar.gz 2>/dev/null | tar -xzOf - ./control 2>/dev/null | grep '^Depends:' || true)"
            echo "$target deb Depends: $deps"
            case "$deps" in
              *webkit*) echo "$target deb still depends on WebKitGTK: $deps"; exit 1 ;;
            esac
            case "$deps" in
              *ayatana*|*appindicator*) ;;
              *) echo "$target deb lacks the tray dependency (ayatana-appindicator): $deps"; exit 1 ;;
            esac
          done
          echo "Linux artifacts look right"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-artifacts
          path: |
            build/linux-amd64
            build/linux-arm64
          retention-days: 14
          if-no-files-found: error

  e2e:
    name: Linux lifecycle E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install a virtual display and the GTK tray library
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libayatana-appindicator3-1 dbus-x11

      - name: Run Linux lifecycle E2E under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          # 三条一起跑（一条命令、一次编译）：
          #   起得来（窗口画得出来）、第二个实例递完命令行自己退出、
          #   托盘菜单的「退出程序」真的让进程退出来（走 E2E 钩子——
          #   Xvfb 下没有面板画 AppIndicator 菜单，窗口上也没有菜单栏）。
          #   外加文件关联那一族：.m4a 有一句「放不了」、.flac 真的放起来。
          #
          # ⚠️ dbus-x11 + dbus-run-session：托盘是 AppIndicator，要走
          # session bus；没有它 `installTray` 只是建不出来（记一行日志、
          # 应用继续跑），而「窗口收进托盘之后怎么回来」这条就没人验。
          xvfb-run -a dbus-run-session -- \
            env BIU_RUN_MYGO_E2E=1 \
            go test -tags e2e ./internal/e2e \
              -run 'TestLinuxLifecycle|TestLinuxFileAssociations' \
              -count=1 -timeout 300s
