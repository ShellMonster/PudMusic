name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to build'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # build-<target>：拆到单架构粒度——linux 两个 job 挪去 ubuntu（没有 dmg/
  # NSIS/签名要 mac 的依赖，ubuntu 并发槽还不要钱）；darwin 两架构留同一
  # job（dmg 打包本身便宜，拆开只多一遍 setup）；windows 两架构拆开，它
  # 是 delta 生成最慢的一组。
  #
  # 产物经 actions/upload-artifact 交给最后的 publish job 统一挂到草稿
  # Release。SHA256SUMS 和 Release 说明也都在 publish job 拼——那时候
  # 全部资产齐了，名单才完整。
  # ------------------------------------------------------------------
  release:
    name: Build ${{ matrix.target }} assets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # mac 并发槽要省着用：公开仓库上限 5 个。darwin 合一 + windows 拆
          # 两个架构 = 3 个 mac job，剩下的 linux 两个上 ubuntu。
          - target: darwin
            os: macos-15-intel
            platforms: darwin/amd64,darwin/arm64
          - target: windows-amd64
            os: macos-15-intel
            platforms: windows/amd64
          - target: windows-arm64
            os: macos-15-intel
            platforms: windows/arm64
          - target: linux-amd64
            os: ubuntu-latest
            platforms: linux/amd64
          - target: linux-arm64
            os: ubuntu-latest
            platforms: linux/arm64
    env:
      GH_TOKEN: ${{ github.token }}
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          # tag push 时 tag 就是 HEAD，不需要历史；workflow_dispatch 要
          # `git describe --tags` 找前一版说明范围，那时候才全量拉。
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NSIS
        # NSIS 只给 Windows 安装包用；darwin/linux 用不上，跳过省几秒。
        if: startsWith(matrix.target, 'windows')
        run: brew install nsis

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            tag="${{ inputs.tag }}"
          fi
          [[ "$tag" == v* ]] || { echo "tag must start with v: $tag" >&2; exit 1; }
          version="${tag#v}"
          actual="$(python3 - <<'PY'
          import json
          print(json.load(open('mygo.json'))['version'])
          PY
          )"
          [[ "$actual" == "$version" ]] || {
            echo "mygo.json version $actual does not match tag $tag" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify update signing key
        run: |
          test -n "$MYGO_UPDATER_PRIVATE_KEY" || {
            echo 'Missing MYGO_UPDATER_PRIVATE_KEY repository secret.' >&2
            exit 1
          }

      # 发版前必查的项：版本号对得上 tag、生成物没和源码脱节。build/vet/test
      # 全量那套在合并 PR 的 CI 里已经跑过同一个提交，这里不重复（省 ~3 分钟）；
      # licensing 和 generated resources 是 PR CI 不查的发布专属项。
      #
      # 只在 darwin job 跑一次：gen-notices 对 darwin/windows 四个目标跑
      # `go list`，换 OS 结果不变，没必要五个 job 各跑一遍。
      - name: Run release checks
        if: matrix.target == 'darwin'
        run: |
          go test ./internal/licensing/
          go generate ./internal/platform/ ./internal/licensing/
          git diff --exit-code -- resources

      - name: Build ${{ matrix.target }} release assets
        run: |
          go tool mygo build -platform ${{ matrix.platforms }}

      - name: Rename ${{ matrix.target }} assets to platform-friendly names
        run: scripts/rename-release-assets.sh ${{ matrix.platforms }}

      - name: Verify ${{ matrix.target }} release assets
        run: scripts/verify-release-assets.sh ${{ matrix.platforms }}

      - name: Upload ${{ matrix.target }} assets for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          # `build/<goos>-*` 一次匹配两个架构目录：通配的公共前缀是
          # `build/`，所以 artifact 里**保留 `<goos>-<arch>/` 这层目录名**，
          # publish job 靠它把产物归位（写成 `build/<goos>-amd64/*` 会把
          # 文件散到 artifact 根上）。
          path: build/*
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------
  # publish：等三个 build job 都完，把六套产物拉下来，算出全量
  # SHA256SUMS，写说明，一次性挂到草稿 Release。
  # ------------------------------------------------------------------
  publish:
    name: Publish ${{ github.ref_name }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          # publish job 要写 release 说明，`generate-release-notes.sh` 靠
          # `git describe --tags` 找上一版——浅 clone 没有别的 tag，拉不全。
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            tag="${{ inputs.tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download all platform assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: build
          merge-multiple: false

      # 每个 artifact 解到 build/release-assets-<target>/，里面是
      # `<goos>-<arch>/` 平台目录；归位到 build/<goos>-<arch>/ 再统一验。
      - name: Lay out assets and build SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for d in build/release-assets-*/*/; do
            # d 形如 build/release-assets-darwin/darwin-amd64/
            name="$(basename "$d")"
            mkdir -p "build/$name"
            mv "$d"* "build/$name/"
            found=$((found+1))
          done
          rm -rf build/release-assets-*
          [ "$found" -eq 6 ] || { echo "expected 6 platform dirs, got $found" >&2; ls build >&2; exit 1; }
          # SHA256SUMS 原来由 mygo build 在最后一把全量写——拆 job 之后没人
          # 看得见全部文件，这里统一算：对每份发布资产 sha256 一份，写到
          # build/SHA256SUMS（和用户拿到手核的那一份同名）。
          (cd build && find . -mindepth 2 -maxdepth 2 -type f \
            \( -name '*.tar.gz' -o -name '*.delta' -o -name '*.dmg' -o -name '*.deb' \
               -o -name '*-setup-*.exe' -o -name 'install.sh' -o -name 'install.ps1' \
               -o -name 'PKGBUILD' \) ! -name 'SHA256SUMS' -print0 \
            | sort -z | xargs -0 shasum -a 256 | sed 's| \./|  |' > SHA256SUMS)
          cat build/SHA256SUMS

      - name: Verify release assets
        run: scripts/verify-release-assets.sh

      - name: Generate release notes
        run: scripts/generate-release-notes.sh '${{ steps.release.outputs.tag }}' release-notes.md

      - name: Upload assets to draft release
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          assets=()
          for d in build/darwin-arm64 build/darwin-amd64 build/linux-amd64 build/linux-arm64 build/windows-amd64 build/windows-arm64; do
            while IFS= read -r f; do
              assets+=("$f")
            done < <(find "$d" -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.delta' -o -name '*.dmg' -o -name '*.deb' -o -name '*-setup-*.exe' -o -name 'update-*.json' -o -name 'install.sh' -o -name 'install.ps1' -o -name 'PKGBUILD' \) -print | sort)
          done
          # `install.sh` / `install.ps1` 每个平台目录里都有一份、内容相同——
          # 只留第一份，同名再传第二个会被 GitHub 挡下（ReleaseAsset.name already
          # exists，--clobber 也救不回来）。
          _deduped=()
          _names=""
          for f in "${assets[@]}"; do
            b="$(basename "$f")"
            case "|${_names}|" in
              *"|${b}|"*) ;;
              *)
                _names="${_names}|${b}"
                _deduped+=("$f")
                ;;
            esac
          done
          assets=("${_deduped[@]}")
          # SHA256SUMS 在 build/ 顶层
          [ -f build/SHA256SUMS ] && assets+=("build/SHA256SUMS")
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no assets found" >&2; exit 1
          fi
          # 已存在且已发布的 release 不动：那是发出去过的东西，重传等于撤版。
          is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo '')"
          if [ "$is_draft" = "false" ]; then
            echo "Release $TAG is already published; refusing to re-upload." >&2
            exit 1
          elif [ "$is_draft" = "true" ]; then
            # 草稿：清掉上次留下的资产再重传，保证只有品牌名这一套。
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | while read -r n; do gh release delete-asset "$TAG" "$n" --repo "$GITHUB_REPOSITORY" --yes; done
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            # release 不存在：建草稿并挂资产。
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" "${assets[@]}"
          fi

      - name: Update draft release notes (drafts only)
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo '')"
          if [[ "$is_draft" == "true" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          elif [[ "$is_draft" == "false" ]]; then
            echo "Release $TAG is already published; skipping notes edit to avoid re-draft."
          else
            echo "Could not determine draft state of $TAG; skipping."
          fi

      - name: Summarize release
        run: |
          {
            echo '### Draft release created'
            echo
            echo "Tag: ${{ steps.release.outputs.tag }}"
            echo
            echo 'The release is a draft. Review its assets and publish it from GitHub when ready.'
          } >> "$GITHUB_STEP_SUMMARY"
