name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to build'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # build-<GOOS>：三个 job 并行——macOS / Windows / Linux 各打自己两个
  # 架构的安装包和更新归档。MyGo 没有 cgo，任何平台都能从任何机器交叉；
  # dmg / NSIS 需要 macOS，所以全部留在 macos runner 上，靠 job 并行抢
  # 时间（原来 6 个平台串行 ~12 分钟 → 现在每组 ~4 分钟并行跑）。
  #
  # 产物经 actions/upload-artifact 交给最后的 publish job 统一挂到草稿
  # Release。SHA256SUMS 和 Release 说明也都在 publish job 拼——那时候
  # 全部资产齐了，名单才完整。
  # ------------------------------------------------------------------
  release:
    name: Build ${{ matrix.goos }} assets
    runs-on: macos-15-intel
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, windows, linux]
    env:
      GH_TOKEN: ${{ github.token }}
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NSIS
        run: brew install nsis

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            tag="${{ inputs.tag }}"
          fi
          [[ "$tag" == v* ]] || { echo "tag must start with v: $tag" >&2; exit 1; }
          version="${tag#v}"
          actual="$(python3 - <<'PY'
          import json
          print(json.load(open('mygo.json'))['version'])
          PY
          )"
          [[ "$actual" == "$version" ]] || {
            echo "mygo.json version $actual does not match tag $tag" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify update signing key
        run: |
          test -n "$MYGO_UPDATER_PRIVATE_KEY" || {
            echo 'Missing MYGO_UPDATER_PRIVATE_KEY repository secret.' >&2
            exit 1
          }

      # 发版前必查、且每个 job 都要各查一遍的项：版本号对得上 tag、生成物
      # 没和源码脱节。build/vet/test 全量那套在合并 PR 的 CI 里已经跑过同一
      # 个提交，这里不重复（省 ~3 分钟）；licensing 和 generated resources
      # 是 PR CI 不查的发布专属项，留。
      - name: Run release checks
        run: |
          go test ./internal/licensing/
          go generate ./internal/platform/ ./internal/licensing/
          git diff --exit-code -- resources

      - name: Build ${{ matrix.goos }} release assets
        run: |
          go tool mygo build -platform ${{ matrix.goos }}/amd64,${{ matrix.goos }}/arm64

      - name: Rename ${{ matrix.goos }} assets to platform-friendly names
        run: scripts/rename-release-assets.sh ${{ matrix.goos }}/amd64 ${{ matrix.goos }}/arm64

      - name: Verify ${{ matrix.goos }} release assets
        run: scripts/verify-release-assets.sh ${{ matrix.goos }}/amd64 ${{ matrix.goos }}/arm64

      - name: Upload ${{ matrix.goos }} assets for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.goos }}
          # `build/<goos>-*` 一次匹配两个架构目录：通配的公共前缀是
          # `build/`，所以 artifact 里**保留 `<goos>-<arch>/` 这层目录名**，
          # publish job 靠它把产物归位（写成 `build/<goos>-amd64/*` 会把
          # 文件散到 artifact 根上）。
          path: build/${{ matrix.goos }}-*
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------
  # publish：等三个 build job 都完，把六套产物拉下来，算出全量
  # SHA256SUMS，写说明，一次性挂到草稿 Release。
  # ------------------------------------------------------------------
  publish:
    name: Publish ${{ github.ref_name }}
    needs: release
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            tag="${{ inputs.tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download all platform assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: build
          merge-multiple: false

      # artifact 展开成 build/release-assets-<goos>/<平台目录>/*，归位到
      # build/<平台目录>/ 再统一验。
      - name: Lay out assets and build SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          for goos in darwin windows linux; do
            for arch in amd64 arm64; do
              src="build/release-assets-${goos}/${goos}-${arch}"
              dst="build/${goos}-${arch}"
              [ -d "$src" ] || { echo "missing artifact dir $src" >&2; exit 1; }
              mkdir -p "$dst"
              mv "$src"/* "$dst"/
            done
          done
          rm -rf build/release-assets-*
          # SHA256SUMS 原来由 mygo build 在最后一把全量写——拆 job 之后没人
          # 看得见全部文件，这里统一算：对每份发布资产 sha256 一份，写到
          # build/SHA256SUMS（和用户拿到手核的那一份同名）。
          (cd build && find . -mindepth 2 -maxdepth 2 -type f \
            \( -name '*.tar.gz' -o -name '*.delta' -o -name '*.dmg' -o -name '*.deb' \
               -o -name '*-setup-*.exe' -o -name 'install.sh' -o -name 'install.ps1' \
               -o -name 'PKGBUILD' \) ! -name 'SHA256SUMS' -print0 \
            | sort -z | xargs -0 shasum -a 256 | sed 's| \./|  |' > SHA256SUMS)
          cat build/SHA256SUMS

      - name: Verify release assets
        run: scripts/verify-release-assets.sh

      - name: Generate release notes
        run: scripts/generate-release-notes.sh '${{ steps.release.outputs.tag }}' release-notes.md

      - name: Upload assets to draft release
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          assets=()
          for d in build/darwin-arm64 build/darwin-amd64 build/linux-amd64 build/linux-arm64 build/windows-amd64 build/windows-arm64; do
            while IFS= read -r f; do
              assets+=("$f")
            done < <(find "$d" -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.delta' -o -name '*.dmg' -o -name '*.deb' -o -name '*-setup-*.exe' -o -name 'update-*.json' -o -name 'install.sh' -o -name 'install.ps1' -o -name 'PKGBUILD' \) -print | sort)
          done
          # `install.sh` / `install.ps1` 每个平台目录里都有一份、内容相同——
          # 只留第一份，同名再传第二个会被 GitHub 挡下（ReleaseAsset.name already
          # exists，--clobber 也救不回来）。
          _deduped=()
          _names=""
          for f in "${assets[@]}"; do
            b="$(basename "$f")"
            case "|${_names}|" in
              *"|${b}|"*) ;;
              *)
                _names="${_names}|${b}"
                _deduped+=("$f")
                ;;
            esac
          done
          assets=("${_deduped[@]}")
          # SHA256SUMS 在 build/ 顶层
          [ -f build/SHA256SUMS ] && assets+=("build/SHA256SUMS")
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no assets found" >&2; exit 1
          fi
          # 已存在且已发布的 release 不动：那是发出去过的东西，重传等于撤版。
          is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo '')"
          if [ "$is_draft" = "false" ]; then
            echo "Release $TAG is already published; refusing to re-upload." >&2
            exit 1
          elif [ "$is_draft" = "true" ]; then
            # 草稿：清掉上次留下的资产再重传，保证只有品牌名这一套。
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | while read -r n; do gh release delete-asset "$TAG" "$n" --repo "$GITHUB_REPOSITORY" --yes; done
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            # release 不存在：建草稿并挂资产。
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" "${assets[@]}"
          fi

      - name: Update draft release notes (drafts only)
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo '')"
          if [[ "$is_draft" == "true" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          elif [[ "$is_draft" == "false" ]]; then
            echo "Release $TAG is already published; skipping notes edit to avoid re-draft."
          else
            echo "Could not determine draft state of $TAG; skipping."
          fi

      - name: Summarize release
        run: |
          {
            echo '### Draft release created'
            echo
            echo "Tag: ${{ steps.release.outputs.tag }}"
            echo
            echo 'The release is a draft. Review its assets and publish it from GitHub when ready.'
          } >> "$GITHUB_STEP_SUMMARY"
