name: Comment PR UI screenshots

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    # 与 ui-screenshots.yml 用**同一套** paths 过滤：那个 workflow 只在动了这些路径时
    # 才跑，本 workflow 也必须同样只在这些情况下跑。否则本 workflow 会去等一个
    # 永远不会出现的截图 run（只改文档的 PR 就撞这个），干等十几分钟后以
    # 「No UI screenshot run found」失败——那是本 workflow 的缺陷，不是 PR 的问题。
    paths:
      - 'internal/ui/**'
      - 'internal/app/**'
      - 'internal/service/bili/**'
      - 'resources/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ui-screenshots.yml'
      - '.github/workflows/ui-screenshots-comment.yml'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number whose latest UI screenshot run should be commented'
        required: true
        type: number

permissions: {}

jobs:
  comment:
    name: Update PR screenshot comment
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Wait for and update PR comment
        uses: actions/github-script@v7
        env:
          MARKER: '<!-- pudmusic-ui-screenshots -->'
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = process.env.MARKER;
            const prNumber = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.pr_number)
              : context.payload.pull_request.number;

            const pr = (await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            })).data;
            if (pr.state !== 'open' || pr.base.ref !== 'main') {
              core.info(`PR #${prNumber} is not an open PR targeting main; skipping.`);
              return;
            }

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            let run;
            for (let attempt = 0; attempt < 40; attempt += 1) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, event: 'pull_request', per_page: 100 },
              );
              const matching = runs
                .filter((item) =>
                  item.name === 'PR UI screenshots' &&
                  item.head_sha === pr.head.sha &&
                  item.head_branch === pr.head.ref,
                )
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              run = matching[0];
              if (run && ['completed', 'cancelled', 'failure', 'timed_out', 'action_required'].includes(run.status)) {
                break;
              }
              if (attempt < 39) {
                await sleep(15000);
              }
            }

            if (!run) {
              // 本 workflow 的职责是**贴一条评论**，不是当门禁：截图跑没跑、过没过，
              // 由 ui-screenshots.yml 自己报。所以「没找到截图 run」不该把这里判红——
              // 那样只会在 PR 上多一个误导性的红叉（真有问题的那次运行已经报过红了）。
              core.info(
                `No UI screenshot run found for PR #${prNumber} head ${pr.head.sha}; ` +
                'skipping the comment without failing this job.',
              );
              return;
            }

            const current = (await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            })).data;
            if (current.head.sha !== run.head_sha) {
              core.info('The PR moved to a newer head; skipping this older screenshot run.');
              return;
            }

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: run.id, per_page: 100 },
            );
            const artifactName = `ui-screenshots-${run.id}`;
            const artifact = artifacts.find((item) =>
              item.name === artifactName && !item.expired,
            );
            const artifactUrl = artifact
              ? `https://github.com/${owner}/${repo}/actions/runs/${run.id}/artifacts/${artifact.id}`
              : '';
            const conclusion = run.conclusion || 'unknown';
            const statusLine = conclusion === 'success'
              ? '截图测试已通过。'
              : `截图测试结果为 **${conclusion}**，请打开运行记录查看失败步骤。`;
            const artifactLine = artifact
              ? `[下载 UI 截图 artifact](${artifactUrl})`
              : '本次运行没有可下载的截图 artifact。';
            const body = [
              marker,
              '## PudMusic UI 截图',
              '',
              statusLine,
              '',
              `- [查看截图 workflow 运行记录](${run.html_url})`,
              `- ${artifactLine}`,
              `- PR head：\`${run.head_sha.slice(0, 12)}\``,
              '',
              '截图来自项目现有的 MyGo UI 测试渲染器，使用本地 fixture，不启动真实登录态。',
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: prNumber, per_page: 100 },
            );
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              typeof comment.body === 'string' &&
              comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated screenshot comment ${existing.id} on PR #${prNumber}.`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
              core.info(`Created screenshot comment on PR #${prNumber}.`);
            }
