name: Comment PR UI screenshots

on:
  workflow_run:
    workflows:
      - PR UI screenshots
    types:
      - completed

permissions: {}

jobs:
  comment:
    name: Update PR screenshot comment
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: write

    steps:
      - name: Update PR comment
        uses: actions/github-script@v7
        env:
          MARKER: '<!-- pudmusic-ui-screenshots -->'
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = process.env.MARKER;
            const runUrl = run.html_url;
            const conclusion = run.conclusion || 'unknown';

            const associated = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: run.head_sha, per_page: 100 },
            );
            const candidates = associated.filter((pr) =>
              pr.state === 'open' &&
              pr.base.ref === 'main' &&
              pr.head.sha === run.head_sha,
            );

            if (candidates.length === 0) {
              core.info(`No open main PR currently points at ${run.head_sha}; skipping.`);
              return;
            }
            if (candidates.length > 1) {
              core.setFailed(`More than one matching PR points at ${run.head_sha}.`);
              return;
            }

            const pr = candidates[0];
            const current = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr.number,
            });
            if (current.data.head.sha !== run.head_sha) {
              core.info('The PR moved to a newer head; skipping this older screenshot run.');
              return;
            }

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: run.id, per_page: 100 },
            );
            const artifactName = `ui-screenshots-${run.id}`;
            const artifact = artifacts.find((item) =>
              item.name === artifactName && !item.expired,
            );
            const artifactUrl = artifact
              ? `https://github.com/${owner}/${repo}/actions/runs/${run.id}/artifacts/${artifact.id}`
              : '';

            const statusLine = conclusion === 'success'
              ? '截图测试已通过。'
              : `截图测试结果为 **${conclusion}**，请打开运行记录查看失败步骤。`;
            const artifactLine = artifact
              ? `[下载 UI 截图 artifact](${artifactUrl})`
              : '本次运行没有可下载的截图 artifact。';
            const body = [
              marker,
              '## PudMusic UI 截图',
              '',
              statusLine,
              '',
              `- [查看截图 workflow 运行记录](${runUrl})`,
              `- ${artifactLine}`,
              `- PR head：\`${run.head_sha.slice(0, 12)}\``,
              '',
              '截图来自项目现有的 MyGo UI 测试渲染器，使用本地 fixture，不启动真实登录态。',
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pr.number, per_page: 100 },
            );
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              typeof comment.body === 'string' &&
              comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated screenshot comment ${existing.id} on PR #${pr.number}.`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
              core.info(`Created screenshot comment on PR #${pr.number}.`);
            }
