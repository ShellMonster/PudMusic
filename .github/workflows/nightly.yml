name: Nightly race and vulnerability scan

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  race:
    name: Race detector on concurrent packages
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Go toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/go
          key: ${{ runner.os }}-go-toolchain-${{ hashFiles('go.mod') }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test with -race
        run: >-
          go test -race -count=1
          ./internal/service/audio/...
          ./internal/platform
          ./internal/app
          ./internal/ui/widgets/imgcache

  govulncheck:
    name: Known vulnerabilities
    runs-on: macos-15-intel
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Go toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/go
          key: ${{ runner.os }}-go-toolchain-${{ hashFiles('go.mod') }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
