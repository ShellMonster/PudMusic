name: Nightly race and vulnerability scan

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  race:
    name: Race detector (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            packages: ./internal/service/audio/... ./internal/platform ./internal/app ./internal/ui/widgets/imgcache
          - runner: macos-15-intel
            packages: ./internal/service/audio

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test with -race
        shell: bash
        run: |
          set -euo pipefail
          read -ra packages <<< "$PACKAGES"
          if [[ "$RUNNER_OS" == Linux ]]; then
            go list "${packages[@]}" | grep -vxF 'github.com/ShellMonster/PudMusic/internal/service/audio' | xargs go test -race -count=1 -p 4
          else
            go test -race -count=1 -p 4 "${packages[@]}"
          fi
        env:
          PACKAGES: ${{ matrix.packages }}

  govulncheck:
    name: Known vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
