name: Windows AAC spike

# 这一份是 GitHub issue #128 的验收通道：**Windows 上解 AAC 的 spike**。
#
# 为什么要专门一个工作流：这个仓库的主验收跑在 macOS 上，而这一票要验的
# 东西（Media Foundation、COM apartment、逐样本解码）**只在 Windows 上存在**。
# GitHub Actions 的 `windows-2022` runner 是免费的真 Windows——
# 「没有 Windows 机器所以无法验证」这个前提不成立。
#
# 它跑的是 `internal/service/audio/mfadec` 那一包里的 `TestSpike*`：
#
#   - TestSpikeAACLCDecodesOutOfMediaFoundation —— MFT 能不能解出 AAC
#   - TestSpikeFirstFrameLatency                —— 首帧延迟（目标 200 ms 内）
#   - TestSpikeWhichProfilesWeCanActuallyTest   —— 支持哪些 profile
#   - TestSpikePCMIsWithinTolerancesOfTheReference —— 逐样本比对
#   - TestSpikeTheChannelsAreNotSwapped         —— 左右声道没调换
#   - TestSpikeTheCOMApartmentSurvivesLoad      —— COM apartment 在负载下反复跑
#
# **外加**产品那一层（`./internal/service/audio/`）：字节从 `openDecoder`
# 进、采样从 MyGo 的 `audio.Decoder` 接口出——认容器、截到容器说的呈现长度、
# 丢掉编码器延迟，这三件事 spike 那几条碰不到。它顺带产出「B 站五档 ×
# Windows」那张覆盖表。
#
# ⚠️ 那是**唯一一个包**，不是 `./internal/service/audio/...`——子包的取舍见
# 「跑产品这一层的解码测试」那一步的注释（issue #258）。
#
# 答案全在 `t.Logf` 里，所以**必须 `-v`**，而且日志要存成 artifact——
# 报告里引用的那些数字就是从这儿来的。

on:
  pull_request:
    paths:
      - "internal/service/audio/**"
      - "internal/licensing/**"
      - "resources/licenses/**"
      - ".github/workflows/windows-aac-spike.yml"
  # ⚠️ `push` 也按路径过滤，跟上面 `pull_request` **一模一样**。
  #
  # 为什么：这份工作流只验 Windows 上的 AAC 解码（issue #128），跟界面票、
  # 别的包没关系。曾经 `push` 只按分支过滤（`work/**`）→ 每个分支的每次 push
  # 都烧一次 Actions 额度，而板上同时有十个 agent 在推分支，一轮下来满屏红叉
  # （额度用尽时 job 两秒就 failed、runner 都没分配上——那是账单问题，不是代码
  # 问题）。
  #
  # ⚠️ 两条 `paths` 列表必须保持一致：它们是「同一件事的两条路」。漏一条就是
  # 半开半开——改音频不触发、或者改界面照样触发。
  push:
    branches:
      - "work/**"
    paths:
      - "internal/service/audio/**"
      - "internal/licensing/**"
      - "resources/licenses/**"
      - ".github/workflows/windows-aac-spike.yml"
  workflow_dispatch:

jobs:
  windows-aac-spike:
    name: Windows 真机跑 AAC spike
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      # 为了把 spike 的输出贴成一条 PR 评论——真机数字得落在**看得到的地方**，
      # 而不是只躺在 Actions 的日志里。
      pull-requests: write
      # 再贴一份到票面（issue #128）上：本仓库的约定是「裁决跟着票走」，
      # 数字也一样——它们是这条路的**结论**，不是某次运行的副产品。
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 这一步在 macOS 上**根本不存在**：那一半的代码有 `//go:build windows`，
      # 在 macOS 上连编译都不进。所以「能不能编过」这件事只能在这里问。
      - name: 编译与 vet（Windows 这一半）
        run: |
          go build ./...
          go vet ./...

      - name: 跑 spike
        run: |
          go test -v -count=1 -timeout 20m ./internal/service/audio/mfadec/ 2>&1 |
            Tee-Object -FilePath spike.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # COM apartment 那一条**在负载下反复跑**才有意义（小规模测试跑不出来），
      # 所以它单独再跑几遍。
      - name: COM apartment 反复跑
        run: |
          go test -v -count=5 -timeout 20m -run TestSpikeTheCOMApartmentSurvivesLoad ./internal/service/audio/mfadec/ 2>&1 |
            Tee-Object -FilePath apartment.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # **产品这一层**：字节从 `openDecoder` 进（MyGo 的格式表 → extaf 报
      # 「这台机器没有系统解码器」→ 落回 Media Foundation），采样从 MyGo 的
      # `audio.Decoder` 接口出。
      #
      # 这一层多做了三件事，每一件都可能把对的解码结果弄坏：认容器、截到容器
      # 说的呈现长度、丢掉编码器延迟。所以它要**单独**跑一遍——spike 那几条
      # 验的是解码器本身，碰不到这三件事。
      #
      # 它顺带产出「B 站五档 × Windows」那张覆盖表（`TestTheBilibiliQualityCoverage`）。
      #
      # ⚠️ **只跑这一个包，不跑 `...`**（子包）：
      #
      #   - `mfadec/` —— 上面两步已经跑过了（spike + COM apartment），再跑一遍
      #     是白花时间，而且它没有 `-v` 就看不到那些数字；
      #   - `flacdec/`、`mp3dec/` —— **纯 Go，平台无关**，macOS 上每天都在跑，
      #     在 Windows 上再跑一遍买不到新东西（issue #258 的原话：「CI 时间是
      #     这一条的代价，测什么要挑清楚」）；
      #   - `extaf/` —— 在 Windows 上**没有测试文件**（它是 macOS 那一层）。
      #
      # 超时收到 10 分钟：这个包在 macOS 上跑 8 秒，Windows 上多出来的只是
      # Media Foundation 的冷启动（加载 DLL + COM）和五轮首帧延迟测量。
      - name: 跑产品这一层的解码测试
        run: |
          go test -v -count=1 -timeout 10m ./internal/service/audio/ 2>&1 |
            Tee-Object -FilePath product.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # ⚠️ **不许空转**。
          #
          # 这一步最坏的情形不是「红」，是「**绿**」——这个包在 Windows 上
          # 一条都没跑（素材造不出来、平台分支跳过了、路径写错了……），于是
          # CI 报绿，而「Windows 上有产品测试」这个洞**原封不动地留着**。
          # 空转的绿比红的更坏：红的会被人看见。
          #
          # 所以这里点名查一遍：**下面这九条必须在日志里真的出现过**
          # （PASS 或 FAIL 都算——FAIL 本来就会让上面那步红）。它们是
          # 「Windows 上产品这一层真的能解」的证据：
          #
          #   - `.m4a` 和裸 `.aac` 各自落到系统解码器上（macOS 是
          #     AudioToolbox，Windows 是 Media Foundation）；
          #   - 解出来的 PCM 和另一个解码器**逐样本**对得上（两种容器都要）；
          #   - 左右声道没调换；
          #   - 开口到第一个采样在预算内；
          #   - B 站五档的覆盖表；
          #   - 在线的有损流放得出来；
          #   - 无损那一档逐样本对得上（Windows 上它落回 `flacdec`）。
          #
          # 少一条就是「有一格是空的」，CI 报红——**那是这一格该被看见的时候**。
          $mustRun = @(
            'TestOpenRoutesMP4ToTheSystemDecoder',
            'TestOpenRoutesRawADTS',
            'TestTheProductPathDecodesAACSampleForSample',
            'TestTheProductPathDecodesADTSSampleForSample',
            'TestTheProductPathKeepsTheChannelsInPlace',
            'TestTheFirstFrameComesOutFast',
            'TestTheBilibiliQualityCoverage',
            'TestTheAACOnlineStreamActuallyPlays',
            'TestLosslessFLACFromTheStreamIsSampleForSample'
          )
          $log = Get-Content product.log -Raw
          $missing = @()
          foreach ($name in $mustRun) {
            $pattern = "(?m)^--- (PASS|FAIL):\s+$([regex]::Escape($name))\b"
            if ($log -notmatch $pattern) { $missing += $name }
          }
          if ($missing.Count -gt 0) {
            Write-Host ("::error::下面这些测试在 Windows 上没有真的跑到（跳过，或压根没出现）：" + ($missing -join ', '))
            exit 1
          }
          Write-Host ("产品这一层在 Windows 上真的跑到了 " + $mustRun.Count + " 条关键测试。")

      # 报告里引用的数字就在这两个日志里，所以**失败也要存**。
      - name: 存下 spike 的输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-aac-spike-${{ github.run_number }}
          path: |
            spike.log
            apartment.log
            product.log
          if-no-files-found: warn

      # 把真机数字贴成一条 PR 评论。
      #
      # 为什么多这一步：spike 的结论是**数字**（首帧多少毫秒、逐样本差多少、
      # COM 线程被换掉几次），而这些数字只存在于日志里。评审看的是 PR，
      # 人看的是 PR——把数字放到 PR 上，才不用去翻 Actions 的日志。
      - name: 把真机数字贴到 PR 上
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            for (const f of ['spike.log', 'apartment.log', 'product.log']) {
              if (!fs.existsSync(f)) continue;
              body += `\n### ${f}\n\n\`\`\`\n${fs.readFileSync(f, 'utf8').slice(0, 40000)}\n\`\`\`\n`;
            }
            if (!body) body = '\n（没有日志：spike 还没跑起来就失败了。）\n';
            const marker = '<!-- windows-aac-spike -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            const payload = `${marker}\n## Windows 真机上的 AAC spike\n\n本评论由 \`windows-aac-spike\` 这个工作流自动贴出（每次跑覆盖上一条）。\n${body}`;
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id, body: payload });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: payload });
            }
            // 再贴一份到票面（#128）上：本仓库的约定是「裁决跟着票走」，
            // 而这些数字是这条路的**结论**，不是某次运行的副产品。
            // 找不到票、贴不上，都不算失败——PR 上那一条才是主的那一份。
            try {
              const { data: issueComments } = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: 128 });
              const onIssue = issueComments.find(c => c.body && c.body.includes(marker));
              const issuePayload = `${marker}\n## Windows 真机上的 AAC spike（自动贴出，每次跑覆盖上一条）\n${body}`;
              if (onIssue) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo, comment_id: onIssue.id, body: issuePayload });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: 128, body: issuePayload });
              }
            } catch (e) {
              core.info(`贴到 #128 上没成：${e.message}`);
            }
