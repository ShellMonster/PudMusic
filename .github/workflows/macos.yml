name: macOS native CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - README.md
      - docs/**
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - docs/**
  workflow_dispatch:

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  # PR 的新提交取消旧运行；main 上每个提交都必须完整验收。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build all packages
    runs-on: macos-15-intel
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        run: go build -trimpath -p 4 ./...

  test:
    name: Test macOS-specific packages
    runs-on: macos-15-intel
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test
        run: |
          set -euo pipefail
          # Linux CI already tests every portable package. Keep only the
          # platform-specific packages here: native app/platform/service code
          # and the font package that Linux intentionally excludes.
          packages=()
          while IFS= read -r package; do
            [ -n "$package" ] && packages+=("$package")
          done < <(
            go list ./... |
              grep -E '^github.com/ShellMonster/PudMusic/(internal/app|internal/platform|internal/service|internal/ui/widgets/typo)(/|$)'
          )
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No macOS-specific packages selected" >&2
            exit 1
          fi
          printf 'Testing macOS-specific packages:\n%s\n' "${packages[*]}"
          go test -p 4 "${packages[@]}"

  e2e:
    name: MyGo native UI E2E
    runs-on: macos-15-intel
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run MyGo native UI E2E
        shell: bash
        run: |
          set -euo pipefail
          # 四个 E2E 一起跑（**一条命令**）：
          #   - TestMyGoAutomationDrivesNativeUIAndCapturesIt：框架那一族
          #   - TestTheApplicationMenu：菜单栏那一族（票 #712），它在**真窗口**上
          #     按标题找栏、点「设置…」换页
          #   - TestTheStatsPage：听歌统计那一族，它在**真窗口**上按顶栏那枚
          #     图标进统计页
          #   - TestTheListProgressBarIsAProgressIndicatorWithAName：列表行下面那条
          #     进度条（票 #703 的 C 项），它断的是**无障碍树**里那一项的
          #     角色 / 值 / 名字——**只有真窗口 + automation 才读得到**
          #
          # 为什么合成一条命令：它们各自都要**把整个应用编一遍**，而 CI 机器上
          # 那一步不便宜——拆成两条命令就是编两遍，第二遍编的时候机器正忙着，
          # 第一遍那一条就会**卡在 socket 上超时**（实测过一次：
          # 「读取 automation idle：i/o timeout」）。
          #
          # 菜单那一族要**单独的一份数据目录**（automation_e2e.go 顶上那段说了
          # 为什么）：应用有单实例锁，而锁在用户数据目录里——CI 上跑的时候机器上
          # 没有别的实例，这一族本来能过；但**本地**跑的时候用户机器上几乎总是
          # 跑着这个应用，而那一轮会抢不到锁、然后自己退出。
          BIU_RUN_MYGO_E2E=1 go test -tags e2e ./internal/e2e \
            -run 'TestMyGoAutomationDrivesNativeUIAndCapturesIt|TestTheApplicationMenu|TestTheStatsPage|TestTheListProgressBarIsAProgressIndicatorWithAName' \
            -count=1 -timeout 300s

  artifacts:
    name: Build unsigned macOS artifacts
    runs-on: macos-15-intel
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build unsigned macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          unset MYGO_UPDATER_PRIVATE_KEY
          go tool mygo build --platform darwin/arm64,darwin/amd64

      - name: Validate app bundles and disk images
        shell: bash
        run: |
          set -euo pipefail
          : > macos-build-summary.txt

          for target in darwin-arm64 darwin-amd64; do
            dir="build/$target"
            [ -d "$dir" ] || { echo "Missing $dir" >&2; exit 1; }

            app="$(find "$dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
            dmg="$(find "$dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            install_script="$dir/install.sh"
            [ -n "$app" ] || { echo "Missing .app in $dir" >&2; exit 1; }
            [ -n "$dmg" ] || { echo "Missing .dmg in $dir" >&2; exit 1; }
            [ -f "$install_script" ] || { echo "Missing install.sh in $dir" >&2; exit 1; }

            binary="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
            [ -n "$binary" ] || { echo "Missing executable in $app" >&2; exit 1; }

            archs="$(lipo -archs "$binary")"
            case "$target" in
              darwin-arm64) expected='arm64' ;;
              darwin-amd64) expected='x86_64' ;;
            esac
            [ "$archs" = "$expected" ] || {
              echo "$binary has architectures $archs; expected $expected" >&2
              exit 1
            }

            hdiutil imageinfo "$dmg" >/dev/null
            printf '%s\n' "$target" >> macos-build-summary.txt
            printf '  app: %s\n' "$(basename "$app")" >> macos-build-summary.txt
            printf '  dmg: %s\n' "$(basename "$dmg")" >> macos-build-summary.txt
            printf '  install script: %s\n' "$(basename "$install_script")" >> macos-build-summary.txt
            printf '  executable architectures: %s\n' "$archs" >> macos-build-summary.txt
          done

          cat macos-build-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Attribute package size
        shell: bash
        run: |
          set -euo pipefail
          # 主可执行文件 / Resources / 其他 与安装包分开，再列链接依赖和资源来源。
          # 量的是 build/ 里的产物，不是模块缓存。
          go run ./internal/perf/cmd/artifact-report | tee artifact-size.txt
          {
            echo
            echo '### 包体归因'
            echo
            echo '```'
            cat artifact-size.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-native-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            build/darwin-arm64/*.dmg
            build/darwin-arm64/install.sh
            build/darwin-amd64/*.dmg
            build/darwin-amd64/install.sh
            macos-build-summary.txt
